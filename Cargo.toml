[package]
name = "lattice"
version = "1.2.4"
edition = "2021"
description = "A nesting, zooming tiling window manager for Windows"
license = "MIT"

[[bin]]
name = "lattice"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Lattice redraws windows and the drop zone every frame; keep debug builds
# smooth enough to test with.
[profile.dev]
opt-level = 1
