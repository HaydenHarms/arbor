name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-windows-x64
          path: target/release/lattice.exe
      # A published release gets the exe built from its tag.
      - if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} target/release/lattice.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
